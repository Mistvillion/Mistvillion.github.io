<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北城烟雨阁</title>
    <style>
        @font-face {
            font-family: "LXGW WenKai";
            src: url("LXGW WenKai/LXGWWenKai-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "LXGW WenKai";
            src: url("LXGW WenKai/LXGWWenKai-Medium.ttf") format("truetype");
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        :root {
            color-scheme: dark;
            --text: #eef8ff;
            --glass: rgba(8, 16, 26, 0.34);
            --line: rgba(238, 248, 255, 0.26);
            --accent: #a9e7ef;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background: #03070d;
        }

        .page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: grid;
            place-items: center;
            isolation: isolate;
        }

        .background-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
            background: #03070d;
        }

        .video-shade {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(circle at 50% 44%, rgba(145, 210, 226, 0.12), transparent 34%),
                linear-gradient(180deg, rgba(1, 4, 9, 0.2), rgba(1, 4, 9, 0.52));
            pointer-events: none;
        }

        .site-title {
            margin: 0;
            padding: 0 24px;
            font-family: "LXGW WenKai", "PingFang SC", "Microsoft YaHei", serif;
            font-size: clamp(3rem, 8vw, 8rem);
            font-weight: 500;
            letter-spacing: 0.16em;
            text-indent: 0.16em;
            line-height: 1.1;
            text-align: center;
            text-shadow:
                0 0 18px rgba(169, 231, 239, 0.34),
                0 10px 42px rgba(0, 0, 0, 0.72);
            user-select: none;
        }

        .menu-toggle {
            position: fixed;
            top: clamp(18px, 4vw, 34px);
            left: clamp(18px, 4vw, 34px);
            z-index: 20;
            width: 48px;
            height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--text);
            background: rgba(3, 8, 14, 0.36);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            cursor: pointer;
            transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
        }

        .menu-toggle:hover,
        .menu-toggle:focus-visible {
            background: rgba(238, 248, 255, 0.12);
            border-color: rgba(238, 248, 255, 0.44);
            transform: translateY(-1px);
            outline: none;
        }

        .menu-toggle span,
        .menu-toggle::before,
        .menu-toggle::after {
            width: 22px;
            height: 2px;
            border-radius: 999px;
            background: currentColor;
            transition: transform 220ms ease, opacity 180ms ease;
        }

        .menu-toggle::before,
        .menu-toggle::after {
            content: "";
            position: absolute;
        }

        .menu-toggle::before {
            transform: translateY(-7px);
        }

        .menu-toggle::after {
            transform: translateY(7px);
        }

        .menu-toggle[aria-expanded="true"] span {
            opacity: 0;
        }

        .menu-toggle[aria-expanded="true"]::before {
            transform: rotate(45deg);
        }

        .menu-toggle[aria-expanded="true"]::after {
            transform: rotate(-45deg);
        }

        .menu-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: rgba(1, 4, 9, 0.08);
            opacity: 0;
            pointer-events: none;
            transition: opacity 220ms ease;
        }

        .menu-panel {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 15;
            width: min(320px, calc(100vw - 32px));
            height: 100%;
            padding: 112px 28px 32px;
            border-right: 1px solid var(--line);
            background: var(--glass);
            box-shadow: 24px 0 80px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(24px) saturate(130%);
            -webkit-backdrop-filter: blur(24px) saturate(130%);
            transform: translateX(-100%);
            transition: transform 260ms ease;
        }

        body.menu-open .menu-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        body.menu-open .menu-panel {
            transform: translateX(0);
        }

        .menu-links {
            display: grid;
            gap: 16px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .menu-link {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            padding: 0 18px;
            border: 1px solid rgba(238, 248, 255, 0.24);
            border-radius: 8px;
            color: var(--text);
            background: rgba(238, 248, 255, 0.08);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: background 180ms ease, border-color 180ms ease, color 180ms ease, transform 180ms ease;
        }

        .menu-link:hover,
        .menu-link:focus-visible {
            color: #041018;
            background: var(--accent);
            border-color: var(--accent);
            transform: translateX(4px);
            outline: none;
        }

        @media (max-width: 640px) {
            .site-title {
                font-size: clamp(2.6rem, 14vw, 4.7rem);
                letter-spacing: 0.1em;
                text-indent: 0.1em;
            }

            .menu-panel {
                padding-top: 96px;
            }

            .menu-toggle {
                width: 44px;
                height: 44px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.001ms !important;
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <main class="page" aria-label="北城烟雨阁主页">
        <video class="background-video" autoplay muted loop playsinline aria-hidden="true">
            <source src="background-CityOfTears.mp4" type="video/mp4">
        </video>
        <div class="video-shade" aria-hidden="true"></div>

        <button class="menu-toggle" type="button" aria-label="打开导航菜单" aria-controls="site-menu" aria-expanded="false">
            <span aria-hidden="true"></span>
        </button>

        <div class="menu-overlay" data-close-menu aria-hidden="true"></div>

        <nav class="menu-panel" id="site-menu" aria-label="站点导航">
            <ul class="menu-links">
                <li><a class="menu-link" href="https://github.com/Mistvillion" target="_blank" rel="noopener noreferrer">GitHub</a></li>
                <li><a class="menu-link" href="https://blog.sparklerain.top/" target="_blank" rel="noopener noreferrer">Blogs</a></li>
                <li><a class="menu-link" href="https://note.sparklerain.top/" target="_blank" rel="noopener noreferrer">Notes</a></li>
            </ul>
        </nav>

        <h1 class="site-title">北城烟雨阁</h1>
    </main>

    <script>
        const body = document.body;
        const menuToggle = document.querySelector(".menu-toggle");
        const closeTargets = document.querySelectorAll("[data-close-menu]");

        function setMenuOpen(isOpen) {
            body.classList.toggle("menu-open", isOpen);
            menuToggle.setAttribute("aria-expanded", String(isOpen));
            menuToggle.setAttribute("aria-label", isOpen ? "关闭导航菜单" : "打开导航菜单");
        }

        menuToggle.addEventListener("click", () => {
            setMenuOpen(!body.classList.contains("menu-open"));
        });

        closeTargets.forEach((target) => {
            target.addEventListener("click", () => setMenuOpen(false));
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                setMenuOpen(false);
            }
        });
    </script>
</body>
</html>
