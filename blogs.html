<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistvillion's Blogs</title>
    <script>document.documentElement.classList.add("js");</script>
    <link rel="icon" href="assets/images/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.jpg">
    <link rel="preload" href="assets/fonts/PTSerif-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="assets/fonts/PTSerif-Bold.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
    <main class="page" aria-label="Mistvillion's Blogs" data-title="Mistvillion's Blogs">
        <nav class="top-nav" aria-label="Site navigation">
            <div class="nav-links">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="blogs.html" aria-current="page">Blogs</a>
                <a class="nav-link" href="https://github.com/Mistvillion" target="_blank" rel="noopener noreferrer">GitHub</a>
            </div>
        </nav>

        <section class="page-banner" aria-labelledby="blogs-title">
            <img class="page-bg" src="assets/images/background2.webp" alt="" width="1200" height="675" fetchpriority="high" decoding="async">
            <div class="page-banner-inner">
                <h1 class="page-banner-title" id="blogs-title">Blogs</h1>
            </div>
        </section>

        <section class="content-section blogs-view" aria-label="文章列表" lang="zh-CN">
            <div class="section-inner">
                <div class="category-filter" data-category-filter role="group" aria-label="按分类筛选"></div>
                <ol class="post-list" data-post-list></ol>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <p class="site-footer-copy">&copy; 2025&ndash;2026 Mistvillion</p>
        </div>
    </footer>

    <script src="assets/js/site.js"></script>
</body>
</html>
