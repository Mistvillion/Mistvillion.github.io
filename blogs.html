<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistvillion's Blogs</title>
    <script>document.documentElement.classList.add("js");try{if(localStorage.getItem("lang")==="zh-CN"){document.documentElement.lang="zh-CN";}}catch(e){}</script>
    <link rel="icon" href="assets/images/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.jpg">
    <link rel="preload" href="assets/fonts/PTSerif-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="assets/fonts/PTSerif-Bold.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
    <main class="page" aria-label="Mistvillion's Blogs" data-title="blogs.title">
        <nav class="top-nav" aria-label="Site navigation">
            <div class="nav-links">
                <a class="nav-link" href="index.html" data-i18n="nav.home">Home</a>
                <a class="nav-link" href="blogs.html" aria-current="page" data-i18n="nav.blogs">Blogs</a>
                <a class="nav-link" href="https://github.com/Mistvillion" target="_blank" rel="noopener noreferrer">GitHub</a>
            </div>
            <button class="lang-toggle" type="button" data-lang-toggle lang="zh-CN">中文</button>
        </nav>

        <section class="home" aria-labelledby="site-title">
            <img class="page-bg" src="assets/images/background1.webp" alt="" width="2560" height="1440" fetchpriority="high" decoding="async">
            <div class="title-block">
                <h1 class="site-title" id="site-title" data-i18n="blogs.title">Mistvillion's Blogs</h1>
                <p class="site-sub" data-i18n="quote">Such feeling cannot be recalled again; It seemed long lost e'en when it was felt then.</p>
            </div>
        </section>

        <section class="content-section blogs-view" aria-labelledby="posts-title">
            <div class="section-inner">
                <h2 class="section-title" id="posts-title" data-i18n="writing">Writing</h2>
                <div class="category-filter" data-category-filter role="group" aria-label="Filter by category" data-i18n-label="filter"></div>
                <ol class="post-list" data-post-list></ol>
            </div>
        </section>
    </main>

    <script src="assets/js/site.js"></script>
</body>
</html>
